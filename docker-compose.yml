version: '3.9'
services:
  backend:
    build: ./backend
    ports:
      - "8008:8000"
    environment:
      - MIST_API_TOKEN=${MIST_API_TOKEN}
      - MIST_ORG_ID=${MIST_ORG_ID}
      - MIST_BASE_URL=${MIST_BASE_URL}
      - POLLING_INTERVAL_SECONDS=${POLLING_INTERVAL_SECONDS:-300}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3007}
      - HANGAP_RESULTS_MAX_FILES=${HANGAP_RESULTS_MAX_FILES:-50}
      - HANGAP_RESULTS_MAX_TOTAL_MB=${HANGAP_RESULTS_MAX_TOTAL_MB:-500}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:8008}
    ports:
      - "3007:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:8008}
    depends_on:
      - backend
    restart: unless-stopped
